spring.application.name=cuida-plus-api
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/cuida_plus}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

app.jwt.secret=${JWT_SECRET:fDoEurCXcrI8XlmTnumNvugWJ7XuXH5QJNihEpaDcrq}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:720}
app.cors.allowed-origins=http://localhost:19006,http://localhost:8081,http://localhost:3000
app.frontend.reset-password-url=http://localhost:19006
app.password-reset.expiration-minutes=30

app.mail.enabled=true
app.mail.from=no-reply@example.test
app.mail.from-name=Cuidar+

spring.mail.host=${EMAIL_HOST}
spring.mail.port=587
spring.mail.username=${EMAIL_LOGIN}
spring.mail.password=${EMAIL_SENHA}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.connectiontimeout=5000
spring.mail.properties.mail.timeout=5000
spring.mail.properties.mail.writetimeout=5000
